[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axon"
version = "0.1.0"
authors = [
  { name="Author Name", email="author@example.com" },
]
description = "Axon Python library"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/example/axon"
"Bug Tracker" = "https://github.com/example/axon/issues"
