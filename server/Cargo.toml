[package]
name = "server"
version = "0.1.0"
edition = "2024"
description = "Axon central registry. Nodes register, heartbeat, and discover peers here."

[[bin]]
name = "axon-registry"
path = "src/main.rs"

[dependencies]
actix-cors = "0.7"
actix-web = "4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
hmac = "0.12"
log = "0.4"
reqwest = { version = "0.13", default-features = true, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
